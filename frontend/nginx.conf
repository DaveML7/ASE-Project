# Static frontend served by an unprivileged nginx (port 8080). Complete configuration: it needs
# no root, no writable root filesystem and no files outside /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    keepalive_timeout 15;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # Only the static files and the API gateway are allowed to be contacted/loaded.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://localhost:8443 data:; connect-src https://localhost:8443; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/index.html =404;
        }
    }
}

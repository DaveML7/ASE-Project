[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ase-common"
version = "0.1.0"
description = "Shared helpers for the Monster Tamers microservices"
requires-python = ">=3.12"
dependencies = ["Flask==3.0.3", "PyJWT==2.9.0", "requests==2.32.3"]

[tool.setuptools.packages.find]
include = ["ase_common*"]

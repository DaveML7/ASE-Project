openapi: 3.0.3
info:
  title: Players service (internal)
  version: 0.1.0
servers:
  - url: https://players:5002
paths:
  /players/me:
    get:
      summary: Profile and progress
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Player profile }
        '404': { description: Profile not found }
    patch:
      summary: Update avatar/faction
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated profile }
        '400': { description: Invalid avatar or faction }
  /players/me/monsters:
    get:
      summary: Player collection joined with catalogue data
      responses:
        '200': { description: Collection }
  /internal/players:
    post:
      summary: Create profile, progress and starter monsters (internal key only)
      responses:
        '201': { description: Player created with starter monsters }
        '400': { description: Missing player_id or username }
        '403': { description: Missing or wrong internal key }
        '409': { description: Player already exists }
  /internal/players/{player_id}/monsters:
    get:
      summary: Collection of any player, for peer services
      parameters:
        - { name: player_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Collection }
        '403': { description: Missing or wrong internal key }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

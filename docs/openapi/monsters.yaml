openapi: 3.0.3
info:
  title: Monsters service (internal)
  version: 0.1.0
servers:
  - url: https://monsters:5003
paths:
  /monsters:
    get:
      summary: Full catalogue (cacheable, ETag)
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string }, description: ETag from an earlier answer }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
      responses:
        '200': { description: Catalogue, headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string } } } }
        '304': { description: Not modified, the cached copy is still valid }
        '400': { description: limit is not an integer }
  /monsters/{monster_id}:
    get:
      summary: Monster details (cacheable, ETag)
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string }, description: ETag from an earlier answer }
        - { name: monster_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Monster, headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string } } } }
        '304': { description: Not modified }
        '404': { description: Unknown monster }
  /monsters/{monster_id}/image:
    get:
      summary: Deterministic SVG artwork
      responses:
        '200':
          description: SVG
          content:
            image/svg+xml: { schema: { type: string } }
        '404': { description: Unknown monster }
